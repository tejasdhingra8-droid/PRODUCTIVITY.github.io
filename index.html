<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Onyx Vinyl Desktop</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Fredoka', sans-serif; }

    :root {
        --onyx:#0b0b0c;
        --lav:#f3f3f3;
        --glow:rgba(23, 22, 24, 0.6);
    }

    body { background:var(--onyx); color:white; overflow-x:hidden; }

    /* THE SYNCED BACKGROUND */
    #bgLayer {
    position: fixed; 
    inset: -50px; /* Slightly larger than screen to hide blur edges */
    background-size: cover; 
    background-position: center;
    /* Reduced blur from 120px to 60px saves massive CPU */
    filter: blur(60px) brightness(0.25); 
    z-index: -1; 
    transition: 0.8s ease;
    /* Forces the laptop to use the Graphics Card (GPU) instead of CPU */
    will-change: filter;
    transform: translateZ(0); 
}

    .app-container { display:flex; height:100vh; width:100vw; }

    /* VINYL SECTION */
    .vinyl-section {
        flex: 1.2; 
        display: flex;
        justify-content: flex-start;
        align-items: center;
        position: relative;
        overflow: hidden;
    }

    .vinyl-wrapper {
        width: 65vw; 
        height: 65vw; 
        position: relative;
        left: -25vw; 
        flex-shrink: 0;
    }

    .vinyl {
    width: 100%; 
    height: 100%; 
    border-radius: 50%;
    background: repeating-radial-gradient(circle, #111 0px, #111 2px, #0a0a0a 3px, #0a0a0a 4px),
                radial-gradient(circle,#1a1a1a 0%,#050505 60%,#000 100%);
    display: flex; 
    align-items: center; 
    justify-content: center;
    animation: spin 8s linear infinite; 
    animation-play-state: paused;
    /* Reduced blur on shadows prevents GPU lag */
    box-shadow: inset 0 0 50px rgba(255,255,255,0.05), 0 0 30px rgba(0,0,0,0.8);
    /* GPU Acceleration */
    transform: translateZ(0);
}

    @keyframes spin { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

    .album-art {
        width: 38%; 
        aspect-ratio: 1 / 1; 
        min-width: 360px; 
        border-radius: 50%;
        background: #222;
        background-size: cover;
        background-position: center;
        border: 8px solid #000; 
        box-shadow: 0 0 35px var(--glow);
        cursor: pointer;
        transition: background-image 0.5s ease, transform 0.3s ease;
    }

    .album-art:hover { transform: scale(1.02); filter: brightness(1.2); }

    /* RIGHT PANEL */
  .info-section { 
    flex: 0.8; 
    padding: 20px 60px; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    text-align: center; 
    /* Remove justify-content if it's there */
}

    h2 { 
        font-size: 5.5rem; 
        color: var(--lav); 
        text-shadow: 0 0 20px var(--glow); 
        margin-bottom: 0; 
        line-height: 1.1; 
    }

    /* CONTROLS */
    .controls { display:flex; justify-content:center; align-items:center; gap:30px; margin:30px 0; }
    
    button { 
        background:none; border:1px solid rgba(179,157,219,0.3); color:var(--lav); 
        padding: 15px; width: 60px; height: 60px; font-size: 1.2rem;
        border-radius:50%; cursor:pointer; transition:0.3s; 
        display: flex; align-items: center; justify-content: center;
    }

    .play-trigger { width: 90px; height: 90px; font-size: 2rem; }
    button:hover { background:var(--lav); color:#000; box-shadow:0 0 20px var(--glow); }

    .progress-box { width: 100%; margin-top: 15px; }
    #progress { width:100%; accent-color: var(--lav); cursor: pointer; }
    .time-info { display: flex; justify-content: space-between; font-size: 0.9rem; color: #888; margin-top: 5px; }

    /* TIMER SECTION */
    .timer { 
    font-size: 200px; 
    color: #eee; 
    /* Lighter text shadow is much easier to render */
    text-shadow: 0 0 25px var(--glow); 
    transition: color 0.5s ease;
    font-variant-numeric: tabular-nums; 
    display: flex;
    justify-content: center;
    align-items: center;
    height: 320px; 
    width: 1000px; 
    margin: 10px auto; 
    white-space: nowrap; 
    /* This stops the browser from over-calculating invisible areas */
    contain: content; 
}
    .timer-controls { display:flex; justify-content:center; gap:20px; }
    
    .timer-controls button { 
        width: auto; min-width: 120px; height: auto; 
        padding: 15px 30px; border-radius: 50px; 
        font-size: 1.1rem; display: inline-block; 
    }

    .info-section > button {
        width: auto; height: auto; padding: 15px 40px; 
        border-radius: 12px; margin-top: 40px; 
        font-size: 1.2rem; white-space: nowrap; 
    }

    /* PLAYLIST */
    .playlist-container { margin-top:20px; width:100%; max-height:400px; overflow-y:auto; text-align:left; }
    .playlist-item { padding:8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); cursor:pointer; color:#777; }
    .playlist-item.active { color:var(--lav); font-weight: 600; }

    /* SCROLLBAR */
    .playlist-container::-webkit-scrollbar { width: 6px; }
    .playlist-container::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
    .playlist-container::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    .playlist-container::-webkit-scrollbar-thumb:hover { background: var(--lav); }

    /* GLOW STATES */
    .studying-glow { box-shadow: 0 0 30px rgba(244, 242, 246, 0.6) !important; border-color: var(--lav) !important; color: white !important; }
    .break-glow { box-shadow: 0 0 30px rgba(241, 245, 244, 0.4) !important; border-color: #e0ebe9 !important; }
    .done-glow { box-shadow: 0 0 30px rgba(255, 100, 100, 0.4) !important; border-color: #ff6464 !important; }
</style>
</head>
<body>

<div id="bgLayer"></div>
<input type="file" id="manualCoverInput" accept="image/*" style="display:none">

<div class="app-container">
    <div class="vinyl-section">
        <div class="vinyl-wrapper">
            <div class="vinyl" id="vinyl">
                <div class="album-art" id="art"></div>
            </div>
        </div>
    </div>

    <div class="info-section">
        <h2 id="trackTitle">LOCK IN!</h2>
        
        <div class="controls">
            <button onclick="prevTrack()">⏮</button>
            <button onclick="togglePlay()" id="playBtn" class="play-trigger">▶</button>
            <button onclick="nextTrack()">⏭</button>
        </div>

        <div class="progress-box">
            <input type="range" id="progress" min="0" max="100" value="0">
            <div class="time-info">
                <span id="currentT">0:00</span>
                <span id="durationT">0:00</span>
            </div>
        </div>

        <input type="text" id="subjectInput" placeholder="WHAT ARE WE DOING?" 
               style="background:none; border:none; border-bottom:1px solid rgba(255,255,255,0.1); 
                      color:#888; text-align:center; font-family:'Fredoka'; font-size:1.5rem; 
                      letter-spacing:2px; outline:none; margin-top: 30px; width:400px;">
        
        <div class="timer" id="timer">00:00:00</div>
        
        <div class="timer-controls">
            <button onclick="startTimer(event)">LOCK IN</button>
            <button onclick="pauseTimer(event)">BRK</button>
            <button onclick="endSession(event)">DONE</button>
        </div>

        <div class="playlist-container" id="playlist"></div>
        <button onclick="selectFolder()">Pick a vibe!</button>
    </div>
</div>

<audio id="audio"></audio>

<script>
const audio=document.getElementById("audio");
const vinyl=document.getElementById("vinyl");
const art=document.getElementById("art");
const bgLayer=document.getElementById("bgLayer");
const playBtn=document.getElementById("playBtn");
const playlistDiv=document.getElementById("playlist");
const progress=document.getElementById("progress");
const currentTLabel = document.getElementById("currentT");
const durationTLabel = document.getElementById("durationT");

let playlist=[];
let currentIndex=0;

function fmt(seconds) {
    if (isNaN(seconds)) return "0:00";
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
}

async function selectFolder(){
    const dir = await window.showDirectoryPicker();
    playlist = [];
    playlistDiv.innerHTML = "";
    for await (const entry of dir.values()){
        if(entry.kind==="file" && /\.(mp3|wav|ogg|flac|m4a|opus)$/i.test(entry.name)){
            playlist.push(entry);
            const item=document.createElement("div");
            item.className="playlist-item";
            item.innerText=entry.name;
            const idx = playlist.length - 1;
            item.onclick=()=>loadTrack(idx);
            playlistDiv.appendChild(item);
        }
    }
    if(playlist.length>0) loadTrack(0);
}

async function loadTrack(index){
    currentIndex = index;
    const file = await playlist[index].getFile();
    audio.src = URL.createObjectURL(file);
    audio.play();
    vinyl.style.animationPlayState = "running";
    playBtn.innerText = "⏸";
    document.querySelectorAll(".playlist-item").forEach((el,i)=> el.classList.toggle("active",i===index));

    window.jsmediatags.read(file,{
        onSuccess:function(tag){
            if(tag.tags.picture){
                const pic = tag.tags.picture;
                const base64 = pic.data.map(b=>String.fromCharCode(b)).join("");
                const img = `data:${pic.format};base64,${btoa(base64)}`;
                art.style.backgroundImage = `url(${img})`;
                bgLayer.style.backgroundImage = `url(${img})`;
            } else {
                art.style.backgroundImage = "";
                bgLayer.style.backgroundImage = "";
            }
        },
        onError:function(error){ console.log("Tag read error:", error); }
    });
}

function togglePlay(){
    if(audio.paused){ audio.play(); vinyl.style.animationPlayState="running"; playBtn.innerText="⏸"; }
    else { audio.pause(); vinyl.style.animationPlayState="paused"; playBtn.innerText="▶"; }
}

function nextTrack(){
    if(currentIndex < playlist.length - 1) loadTrack(currentIndex + 1);
    else loadTrack(0);
}

function prevTrack(){ if(currentIndex > 0) loadTrack(currentIndex - 1); }

audio.onended = () => nextTrack();
audio.ontimeupdate=()=>{
    if (!isNaN(audio.duration)) {
        progress.value=(audio.currentTime/audio.duration)*100;
        currentTLabel.innerText = fmt(audio.currentTime);
        durationTLabel.innerText = fmt(audio.duration);
    }
};
progress.oninput=()=>{ audio.currentTime=(progress.value/100)*audio.duration; };

/* --- TIMER LOGIC --- */
let startTime = null;
let interval = null;
let pausedTime = 0;

function format(sec){
    let h=String(Math.floor(sec/3600)).padStart(2,"0");
    let m=String(Math.floor((sec%3600)/60)).padStart(2,"0");
    let s=String(sec%60).padStart(2,"0");
    return `${h}:${m}:${s}`;
}

function startTimer(event) {
    if (startTime) return;
    resetButtonGlows();
    event.target.classList.add('studying-glow');
    document.getElementById("timer").style.color = "white";

    startTime = Date.now() - pausedTime;
    interval = setInterval(() => {
        const now = Date.now();
        const diff = Math.floor((now - startTime) / 1000);
        document.getElementById("timer").innerText = format(diff); // Fixed: changed from formatTimer to format
    }, 1000);
}

function pauseTimer(event) {
    if (!startTime) return;
    resetButtonGlows();
    event.target.classList.add('break-glow');
    document.getElementById("timer").style.color = "#64ffda";

    pausedTime = Date.now() - startTime;
    clearInterval(interval);
    interval = null;
    startTime = null;
}

function endSession(event) {
    pauseTimer(event);
    resetButtonGlows();
    event.target.classList.add('done-glow');
    const totalSeconds = Math.floor(pausedTime / 1000);
    const today = new Date().toISOString().split("T")[0];
    let data = JSON.parse(localStorage.getItem("studyData")) || {};
    data[today] = (data[today] || 0) + totalSeconds;
    localStorage.setItem("studyData", JSON.stringify(data));
    pausedTime = 0;
    document.getElementById("timer").innerText = "00:00:00";
    alert("Session Saved.");
}

function resetButtonGlows() {
    document.querySelectorAll('.timer-controls button').forEach(btn => btn.classList.remove('studying-glow', 'break-glow', 'done-glow'));
}

/* --- MANUAL COVER --- */
const manualInput = document.getElementById("manualCoverInput");
art.onclick = () => manualInput.click();
manualInput.onchange = (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            art.style.backgroundImage = `url(${ev.target.result})`;
            bgLayer.style.backgroundImage = `url(${ev.target.result})`;
        };
        reader.readAsDataURL(file);
    }
};
</script>
</body>
</html>
