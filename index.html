<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCK IN - Vinyl Pomodoro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            overflow-y: auto; /* Changed from hidden to allow scrolling */
            overflow-x: hidden;
        }

        /* Large Side Vinyl Positioning - Remains fixed while content scrolls */
        .vinyl-wrapper {
            position: fixed;
            left: -15%;
            top: 50%;
            transform: translateY(-50%);
            width: 600px;
            height: 600px;
            z-index: 1;
            pointer-events: none; /* Allows clicks to pass through to content if needed */
        }

        .vinyl {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a1a1a 30%, #000 70%);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 100px rgba(0,0,0,1);
            pointer-events: auto;
        }

        .vinyl::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: repeating-radial-gradient(
                circle,
                rgba(255,255,255,0.03) 0px,
                rgba(255,255,255,0.03) 1px,
                transparent 2px,
                transparent 4px
            );
        }

        .vinyl.spinning {
            animation: rotate-vinyl 4s linear infinite;
        }

        @keyframes rotate-vinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .label {
            width: 180px;
            height: 180px;
            background: #222;
            border-radius: 50%;
            z-index: 5;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            border: 2px solid #000;
        }

        /* UI Styling */
        .main-content {
            position: relative;
            z-index: 10;
            margin-left: 45%;
            min-height: 100vh; /* Ensure content covers viewport height */
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem 5% 4rem 0; /* Added vertical padding for scrolling clearance */
        }

        .timer-digits {
            font-size: clamp(4rem, 15vw, 10rem); /* Responsive font sizing */
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.05em;
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            margin: 20px 0;
            border-radius: 2px;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: #fff;
            width: 0%;
            transition: width 1s linear;
        }

        .btn-pill {
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.2s;
        }

        .btn-pill:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-pill.active {
            background: #fff;
            color: #000;
            box-shadow: 0 0 15px rgba(255,255,255,0.4);
        }

        .playlist-item {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .playlist-item.playing {
            color: #fff;
        }

        input[type="number"], input[type="text"] {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            color: white;
            text-align: left;
            outline: none;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .vinyl-wrapper {
                position: absolute;
                left: 50%;
                top: -150px;
                transform: translateX(-50%);
                width: 400px;
                height: 400px;
            }
            .main-content {
                margin-left: 0;
                padding: 300px 1rem 4rem 1rem;
                align-items: center;
                text-align: center;
            }
            .timer-digits {
                font-size: 6rem;
            }
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <!-- Vinyl Section -->
    <div class="vinyl-wrapper">
        <div class="vinyl" id="vinyl">
            <div class="label" id="vinyl-label" style="background-image: url('https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=500&auto=format&fit=crop');"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="max-w-xl w-full">
            <h1 id="header-text" class="text-6xl font-black mb-8 italic">LOCK IN!</h1>
            
            <!-- Playback Controls Style -->
            <div class="flex items-center space-x-6 mb-8 text-gray-400 justify-start md:justify-start justify-center">
                <button id="btn-prev" class="hover:text-white transition">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18V6h2v12H6zm3.5-6L18 6v12l-8.5-6z"/></svg>
                </button>
                <button id="btn-play-pause" class="w-12 h-12 rounded-full border border-gray-600 flex items-center justify-center hover:text-white hover:border-white transition">
                    <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button id="btn-next" class="hover:text-white transition">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16 18h2V6h-2v12zM6 18l8.5-6L6 6v12z"/></svg>
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar-container">
                <div id="progress-fill" class="progress-bar-fill"></div>
            </div>

            <div class="mb-4 text-left">
                <span class="text-xs text-gray-500 uppercase tracking-widest block">What are we doing?</span>
                <input type="text" id="task-input" class="w-full text-xl py-2" placeholder="Enter session goal...">
            </div>

            <!-- Timer Display -->
            <div id="timer-display" class="timer-digits">25:00</div>

            <!-- Mode Switchers -->
            <div class="flex space-x-4 mt-8 justify-center md:justify-start">
                <button id="btn-lockin" class="btn-pill active">Lock In</button>
                <button id="btn-break" class="btn-pill">Brk</button>
                <button id="btn-reset" class="btn-pill">Done</button>
            </div>

            <!-- Settings / Uploads Section -->
            <div class="mt-12 grid grid-cols-1 md:grid-cols-2 gap-8 border-t border-white/10 pt-8 text-left">
                <div>
                    <h3 class="text-xs uppercase text-gray-500 mb-4">Timer Settings</h3>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center text-sm">
                            <span>Focus Time</span>
                            <input type="number" id="input-focus" value="25" class="w-12">
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <span>Break Time</span>
                            <input type="number" id="input-break" value="5" class="w-12">
                        </div>
                        <div class="mt-4">
                            <label class="text-xs text-gray-500 block mb-2">Change Label</label>
                            <input type="file" id="image-upload" accept="image/*" class="text-xs text-gray-400">
                        </div>
                    </div>
                </div>
                <div>
                    <h3 class="text-xs uppercase text-gray-500 mb-4">Vibe Playlist</h3>
                    <input type="file" id="audio-upload" accept="audio/*" multiple class="text-xs text-gray-400 mb-4">
                    <div id="playlist-container" class="max-h-48 overflow-y-auto pr-2 custom-scrollbar">
                        <!-- Playlist items appear here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        // State
        let timeLeft = 25 * 60;
        let totalSessionTime = 25 * 60;
        let timerId = null;
        let isRunning = false;
        let currentMode = 'focus';
        let playlist = [];
        let currentTrackIndex = 0;

        // Elements
        const timerDisplay = document.getElementById('timer-display');
        const progressFill = document.getElementById('progress-fill');
        const vinyl = document.getElementById('vinyl');
        const playPauseBtn = document.getElementById('btn-play-pause');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const audioPlayer = document.getElementById('audio-player');
        
        function updateUI() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
            const progress = ((totalSessionTime - timeLeft) / totalSessionTime) * 100;
            progressFill.style.width = `${progress}%`;
        }

        function togglePlay() {
            isRunning ? pause() : start();
        }

        function start() {
            isRunning = true;
            vinyl.classList.add('spinning');
            playIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');
            
            if (playlist.length > 0 && audioPlayer.paused) {
                audioPlayer.play();
            }

            timerId = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateUI();
                } else {
                    clearInterval(timerId);
                    handleSessionEnd();
                }
            }, 1000);
        }

        function pause() {
            isRunning = false;
            clearInterval(timerId);
            vinyl.classList.remove('spinning');
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
            audioPlayer.pause();
        }

        function handleSessionEnd() {
            pause();
            const ding = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
            ding.play().catch(() => {});
            alert(currentMode === 'focus' ? "Focus complete! Break time." : "Break over! Lock in.");
        }

        document.getElementById('btn-lockin').onclick = () => {
            currentMode = 'focus';
            totalSessionTime = (document.getElementById('input-focus').value || 25) * 60;
            timeLeft = totalSessionTime;
            document.getElementById('header-text').textContent = "LOCK IN!";
            document.getElementById('btn-lockin').classList.add('active');
            document.getElementById('btn-break').classList.remove('active');
            pause();
            updateUI();
        };

        document.getElementById('btn-break').onclick = () => {
            currentMode = 'break';
            totalSessionTime = (document.getElementById('input-break').value || 5) * 60;
            timeLeft = totalSessionTime;
            document.getElementById('header-text').textContent = "BREATHER";
            document.getElementById('btn-break').classList.add('active');
            document.getElementById('btn-lockin').classList.remove('active');
            pause();
            updateUI();
        };

        document.getElementById('btn-reset').onclick = () => {
            if(confirm("Reset everything?")) location.reload();
        };

        document.getElementById('image-upload').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                document.getElementById('vinyl-label').style.backgroundImage = `url(${url})`;
            }
        };

        document.getElementById('audio-upload').onchange = (e) => {
            const files = Array.from(e.target.files);
            const container = document.getElementById('playlist-container');
            container.innerHTML = '';
            playlist = files.map((file, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item cursor-pointer';
                item.textContent = `${index + 1}. ${file.name}`;
                item.onclick = () => loadTrack(index);
                container.appendChild(item);
                return { file, element: item };
            });
            if (playlist.length > 0) loadTrack(0);
        };

        function loadTrack(index) {
            if (!playlist[index]) return;
            currentTrackIndex = index;
            const url = URL.createObjectURL(playlist[index].file);
            audioPlayer.src = url;
            playlist.forEach((p, i) => {
                p.element.classList.toggle('playing', i === index);
            });
            if (isRunning) audioPlayer.play();
        }

        document.getElementById('btn-next').onclick = () => {
            if (currentTrackIndex < playlist.length - 1) loadTrack(currentTrackIndex + 1);
        };

        document.getElementById('btn-prev').onclick = () => {
            if (currentTrackIndex > 0) loadTrack(currentTrackIndex - 1);
        };

        playPauseBtn.onclick = togglePlay;
        audioPlayer.onended = () => document.getElementById('btn-next').click();

        updateUI();
    </script>
</body>
</html>
